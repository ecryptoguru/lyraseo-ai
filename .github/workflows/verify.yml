name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      LYRA_AUTH_ENABLED: "false"
      ALLOW_LOCAL_FIXTURES: "true"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.1
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated PostgreSQL and generated client
        run: pnpm db:local
      - name: Generate Next.js route and environment types
        run: pnpm --filter @lyraseo/web exec next typegen
      - name: Generate carrier runtime declarations
        run: pnpm --filter @lyraseo/worker generate-types && git diff --exit-code -- apps/lyraseo-worker/worker-configuration.d.ts
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm test:unit
      - name: Required real HTTP crawler contract matrix
        run: pnpm test:crawler
      - run: pnpm test:integration
      - name: Required legacy visibility retention gate
        run: pnpm test:legacy-visibility-retention
      - name: Required legacy inline evidence and authorization gate
        run: pnpm test:legacy-inline
      - name: Required legacy report preservation and authorization gates
        run: |
          pnpm test:legacy-reports
          pnpm test:legacy-report-review
          pnpm test:legacy-report-role-isolation
      - name: Required private artifact expiry and unsafe-role gate
        run: pnpm test:private-artifact-expiry
      - name: Required provider ledger fixture and restricted-role gate
        run: pnpm test:provider-ledger
      - name: Required restricted external handoff and uncertainty gate
        run: pnpm test:handoffs
      - name: Required handoff dispatch and concurrent recovery gate
        run: pnpm test:handoff-dispatch
      - name: Required offline observation adapter and ledger gate
        run: pnpm test:observation-adapters
      - name: Required sandbox billing and staff boundary gate
        run: pnpm test:sandbox-billing
      - name: Required local retention and deletion recovery gate
        run: pnpm test:history-retention
      - name: Required isolated baseline encrypted backup and journal replay gate
        run: pnpm test:full-backup
      - name: Real Workers carrier and signed Node bridge
        run: pnpm test:worker
      - name: Required signed handoff carrier replay and timeout gate
        run: pnpm test:handoff-carrier
      - name: Replay empty and populated database migrations
        run: pnpm test:migrations
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @lyraseo/web exec playwright install --with-deps chromium
      - name: Required staff job authority, accounting, race and browser gates
        run: pnpm test:staff-job-review
      - name: Actual staff action replay through local API and restricted database
        run: pnpm test:staff-action-replay
      - run: pnpm test:e2e
