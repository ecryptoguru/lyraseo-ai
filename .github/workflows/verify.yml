name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LYRA_AUTH_ENABLED: "false"
      ALLOW_LOCAL_FIXTURES: "true"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.1
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated PostgreSQL and generated client
        run: pnpm db:local
      - name: Generate Next.js route and environment types
        run: pnpm --filter @lyraseo/web exec next typegen
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @lyraseo/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
